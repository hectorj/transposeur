<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pitch shifter DSP harness</title>
  </head>
  <body>
    <p>Offline rendering harness for the real WASM AudioWorklet.</p>
    <script type="module">
      import SignalsmithStretch from '/vendor/SignalsmithStretch.mjs';

      /**
       * Renders `samples` through the shifter in an OfflineAudioContext so the
       * result is deterministic and needs no audio hardware.
       */
      window.renderShift = async ({
        samples,
        sampleRate = 48000,
        semitones = 0,
        formantCompensation = false,
        tailSeconds = 1,
        blockMs = null,
      }) => {
        const input = Float32Array.from(samples);
        const length = input.length + Math.round(sampleRate * tailSeconds);
        const ctx = new OfflineAudioContext({ numberOfChannels: 1, length, sampleRate });

        const buffer = ctx.createBuffer(1, input.length, sampleRate);
        buffer.copyToChannel(input, 0);
        const src = ctx.createBufferSource();
        src.buffer = buffer;

        const stretch = await SignalsmithStretch(ctx, {
          numberOfInputs: 1,
          numberOfOutputs: 1,
          outputChannelCount: [1],
        });
        if (blockMs) await stretch.configure({ blockMs });
        src.connect(stretch);
        stretch.connect(ctx.destination);

        const latency = await stretch.latency();
        await stretch.schedule({ output: 0, active: true, semitones, formantCompensation });
        src.start(0);

        const rendered = await ctx.startRendering();
        return { samples: Array.from(rendered.getChannelData(0)), latency, sampleRate };
      };

      window.harnessReady = true;
    </script>
  </body>
</html>
